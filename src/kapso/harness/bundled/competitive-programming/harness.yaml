schema_version: 1
name: competitive-programming
version: 0.2.0
description: Timed contests scored by an official scorer or leaderboard, heuristic optimisation and machine-learning olympiad tasks alike, with a submission quota, ship-early-then-improve, and a report with every submission.

environment:
  python: requirements.txt

modules:
  setup:
    skills: [scorer-cli, contest-preflight, kaggle-cli]
  ideation:
    skills: [heuristic-patterns, task-type-playbooks, olympiad-playbook, contest-economics]
  implementation:
    skills: [heuristic-patterns, cpp-performance, scorer-cli, kaggle-cli, contest-economics, olympiad-playbook, task-type-playbooks, cv-protocol, ensembling, eda-discipline]
    agents: [score-auditor, submission-auditor]
    hooks: [require-scorer-run, deny-shell-submit, require-insurance]
  verification:
    skills: [scorer-cli, kaggle-cli, cv-protocol]
    agents: [score-auditor, submission-auditor]
  feedback:
    skills: [heuristic-patterns, contest-economics, ensembling]
  learning: {}
