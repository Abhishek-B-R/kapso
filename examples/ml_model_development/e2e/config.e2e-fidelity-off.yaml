# The e2e track's byte-equivalence row: the standing run with fidelity off
# (an explicit reserve, every attempt at full fidelity) must behave like
# the pre-fidelity budget layer. An override file over the packaged config.
hosts:
  claude_code:
    model: claude-opus-4-6
    auth_mode: oauth

search_strategy:
  params:
    ideation:
      timeout: 300
    implementation:
      timeout: 600
    judge:
      timeout: 120

budget:
  minutes: 45
  reserve_minutes: 6

evaluation_maintainer:
  enabled: true
  timeout: 600
  calibration_timeout_seconds: 300
  protected_data_paths: [data]
