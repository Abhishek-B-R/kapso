# The e2e track's standing full run: 45 minutes, fidelity on, the reserve
# derived from committed_run_fraction. An override file over the packaged
# config (`kapso doctor --show-config --config <this file>` prints what a
# run uses); run_e2e.py --config selects it.
#
# The agent stack is the packaged one (same strategy, gates); the track
# measures the budget layer, not a different agent configuration. The
# model and the session ceilings are the track's own.
hosts:
  claude_code:
    model: claude-opus-4-6
    auth_mode: oauth

search_strategy:
  params:
    ideation:
      timeout: 300
    implementation:
      timeout: 600
    judge:
      timeout: 120

budget:
  minutes: 45
  fidelity:
    mode: "on"
    committed_run_fraction: 0.4
    eval:
      fast_fraction: 0.2

evaluation_maintainer:
  enabled: true
  timeout: 600
  calibration_timeout_seconds: 300
  protected_data_paths: [data]
