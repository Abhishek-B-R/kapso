version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: country
        tests: [not_null]
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: [placed, shipped, delivered, returned, cancelled]
  - name: stg_payments
    columns:
      - name: payment_id
        tests: [unique, not_null]
  - name: fct_orders
    description: One row per order; the columns are the contract.
    columns:
      - name: order_id
        tests: [unique, not_null]
  - name: dim_customers
    description: One row per customer; the columns are the contract.
    columns:
      - name: customer_id
        tests: [unique, not_null]
