version: 2

sources:
  - name: raw
    description: The nightly exports, read in place as CSV files.
    meta:
      external_location: "{{ var('data_dir') }}/{name}.csv"
    tables:
      - name: customers
        description: One row per customer; the export repeats a customer whose record changed.
      - name: orders
        description: One row per order; the export may repeat an order whole.
      - name: payments
        description: One row per captured payment; a capture retried is exported twice.
