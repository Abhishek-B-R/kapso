# The IOAI past-contest learning runner: an override file over the
# packaged config. The engine's settings are at the top level; the
# runner's own (the harvest, the session budget shaping, the final
# evaluation) are under `benchmark:`, which the engine never reads.

hosts:
  claude_code:
    model: claude-opus-4-8
    auth_mode: oauth
    effort: max

# Benchmark harness: nobody is at the keyboard.
inbox:
  enabled: false

search_strategy:
  params:
    host: claude_code
    ideation:
      gates: [experiment_history, repo_memory]
      # Leakage-safe on past contests whose reference solutions are
      # published online: no live web in either role, on either host.
      web: false
      candidates_per_member: 3
      timeout: 1500
      ensemble:
        - {cli: codex, effort: xhigh}
        - {cli: claude_code, model: claude-fable-5, effort: max}
      lens_planner: {cli: claude_code, effort: xhigh, timeout: 600}
      selector: {cli: claude_code, model: claude-fable-5, effort: max}
    implementation:
      gates: [repo_memory]
      web: false
      timeout: 7200
    judge:
      effort: xhigh
      timeout: 900
    gate_failure_policy: skip
    session_env_defaults:
      BASH_DEFAULT_TIMEOUT_MS: "900000"
      BASH_MAX_TIMEOUT_MS: "7200000"

budget:
  min_iteration_seconds: 900

retry:
  max_attempts: 5
  initial_delay_seconds: 5
  max_delay_seconds: 120
  multiplier: 2
  jitter: true

benchmark:
  # The harvest session that writes the lesson (harvest/harvest_runner.py).
  harvest:
    model: claude-fable-5
    effort: max
    timeout_seconds: 2400
    allowed_tools: [Read, Bash, Grep, Glob, Write]
  # The runner shapes the session ceilings and the reserve from the run's
  # hours (runner.py: shape_session_timeouts).
  session_budget:
    ideation_fraction: 0.2
    ideation_min_seconds: 300
    implementation_fraction: 0.75
    implementation_min_seconds: 1800
    finalization_reserve_fraction: 0.10
    finalization_reserve_min_minutes: 5
    finalization_reserve_max_minutes: 15
    guard_minutes: 5
  final_eval:
    timeout_seconds: 1800
