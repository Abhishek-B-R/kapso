# Kaggle code-competition benchmark configuration (IOAI AI Models Track
# practice tasks): an override file over the packaged config. The engine's
# settings are at the top level; the runner's own are under `benchmark:`,
# which the engine never reads.
#
# Runs on a plain single-GPU VM. Credentials in the run env:
#   - CLAUDE_CODE_OAUTH_TOKEN  (Claude Max — the Claude sessions)
#   - OPENAI_API_KEY           (litellm utility roles + experiment-store embeddings)
#   - ~/.kaggle/access_token   (Kaggle CLI; read by the kaggle binary itself)
# Wall-clock budgeting is handled by the runner (orchestrator.solve
# time_budget_minutes); the session timeouts here are per-session ceilings
# which the runner shrinks for short runs (benchmark.session_budget).

# Benchmark harness: nobody is at the keyboard, so a session never asks a
# person and never pauses.
inbox:
  enabled: false

search_strategy:
  params:
    # Implementation runs on the codex CLI (gpt-5.6-sol), matching the
    # RelBench codex-primary lineup; OpenAI's reasoning ceiling is xhigh.
    host: codex
    ideation:
      gates: [experiment_history, repo_memory]
      # Candidates each ensemble member is asked for (2 members x 5 = 10),
      # so the selector can still emit 8 ranked solutions for K=8 when one
      # member under-delivers.
      candidates_per_member: 5
      # Session ceilings, deliberately >= any run we launch: the real limit
      # is the run's own searchable budget (the strategy clamps every agent
      # deadline against what remains), not a per-phase slice.
      timeout: 14400
      # Two model families generate ideas in parallel.
      ensemble:
        - {cli: codex, effort: xhigh}
        - {cli: claude_code, model: claude-fable-5, effort: max}
      lens_planner: {cli: claude_code, model: claude-fable-5, effort: high, timeout: 600}
      selector: {cli: codex, effort: xhigh}
    implementation:
      gates: [repo_memory]
      # Web in implementation sessions (the default; explicit to document
      # intent): the handler's three-round loop has lanes web-research how
      # similar problems were pushed further between submits.
      web: true
      timeout: 14400
      # A crashed lane session retries ONCE on this model. Contest 5
      # (2026-08-06, adversarial-robustness task): the provider's safety
      # classifier killed BOTH lanes' codex sessions mid-work ("flagged for
      # possible cybersecurity risk"), and their remaining lane time was
      # lost. A different model version answers a content-policy kill.
      fallback_model: gpt-5.5
    judge:
      timeout: 900
    gate_failure_policy: skip
    # A benchmark has no "goal achieved": the judge's stop vote is advisory
    # and the campaign runs to its budget.
    honor_agent_stop: false
    session_env_defaults:
      BASH_DEFAULT_TIMEOUT_MS: "900000"
      BASH_MAX_TIMEOUT_MS: "7200000"

# Admission floor: don't start a round that can't finish.
budget:
  min_iteration_seconds: 900

retry:
  max_attempts: 5
  initial_delay_seconds: 5
  max_delay_seconds: 120
  multiplier: 2
  jitter: true

# The runner's own settings (benchmarks/ioai2026/runner.py and
# preflight.py read these; the engine never does).
benchmark:
  # Launch defaults (CLI --hours / --node-expansion override these). k=8
  # fans out 8 implementation lanes per round; the runner pins one GPU per
  # lane (CUDA_VISIBLE_DEVICES 0..7), so k=8 assumes an 8-GPU box — the
  # hardware/lane strategy is tuned at launch, not here.
  run_defaults:
    hours: 2.0
    node_expansion: 8
    iterations: 20
  # No per-phase fractions, and NO finalization reserve: every run to date
  # banked a public score long before any wall, while the reserve killed
  # lanes mid-round (5 of 8 in run 5) and starved the feedback sessions to
  # the 60s floor three runs straight. Lanes own their own endgame margin —
  # the handler's loop contract makes the last submission leave room for
  # its scoring — and the post-campaign harvest remains the safety net for
  # pushed-but-unsubmitted kernels.
  session_budget:
    finalization_reserve_minutes: 0
    # Zero harvest carve-out (user-set 2026-08-05): the campaign runs to
    # the window end, and lanes own shipping every completed version
    # in-window themselves — slot-free submits plus the cross-lane
    # SKIP/STEAL/COMPLEMENT/ENSEMBLE protocol make prompt submission the
    # lanes' job, not a sweeper's. (Contest 2 ran a 15-min in-window
    # reserve; retired with this change.)
    guard_minutes: 0
    harvest_window_minutes: 0
    # Refuse to start a campaign with less than this left after preflight —
    # below one submission round trip nothing scoreable can finish.
    min_campaign_minutes: 25
    # Kaggle's per-ACCOUNT concurrent INTERACTIVE session limits, which
    # every lane shares — consumed by kernel pushes ONLY. A code
    # submission's scoring re-run executes on Kaggle's backend scoring
    # infrastructure and holds no interactive session (contest 1,
    # 2026-08-04: five submissions scoring concurrently, zero rejections),
    # so submits are never ticketed. ttl_seconds is when a ticket becomes
    # eligible for truth-verification against Kaggle (NOT a blind reclaim —
    # a dead lane's kernel keeps running); reap_interval rate-limits those
    # checks; verify_timeout bounds each kaggle CLI verification call.
    kernel_slots:
      gpu: 2
      cpu: 5
      ttl_seconds: 600
      reap_interval_seconds: 60
      verify_timeout_seconds: 120
      # How often a queued lane re-polls the office; a waiter that missed
      # six polls is dropped from the line.
      poll_seconds: 5
      # Queue ordering ages a waiting request one tier step per this many
      # seconds (never into ship), so evidence-based ordering cannot starve
      # a weak-scored lane behind a stream of stronger arrivals.
      aging_seconds: 900
  # Post-campaign scoring = harvest, then poll the Kaggle submissions list.
  # The harvest submits every COMPLETE kernel the run pushed but never
  # submitted; `-v` is mandatory and the CLI exposes no version, so it
  # probes downward from harvest_max_kernel_version to find the newest
  # that takes.
  final_eval:
    timeout_seconds: 900
    # The submissions list is read page by page (the CLI's page holds
    # twenty rows by default, two hundred at most); the provided evaluation
    # reads the same pages with the same timeout.
    submissions_page_size: 200
    harvest_unsubmitted: true
    # The competition's own sample file in dataset/, used to check a
    # harvested kernel's output has the right ids before submitting it.
    submission_template: "submission.csv"
    harvest_max_kernel_version: 12
    harvest_kernel_list_size: 50
    # 0 (user-set 2026-08-05): the post-campaign harvest is a no-op —
    # candidates are enumerated and reported as skipped, nothing is
    # submitted after the window closes.
    harvest_budget_seconds: 0
    harvest_poll_seconds: 30
    # One re-probe of a kernel whose every version was rejected — a
    # transient rejection (foreign session, blip) is not a dead kernel.
    harvest_retry_seconds: 60
  # URL->run-root preflight: one session that downloads the competition
  # (authenticated kaggle CLI) and authors dataset/statement.md per
  # benchmarks/ioai2026/preflight_spec.md. cli is codex or claude_code; a
  # claude_code preflight additionally needs an auth_mode key.
  preflight:
    cli: codex
    model: gpt-5.6-sol
    effort: high
    timeout: 1800
    web_search: true

evaluation_maintainer:
  # The official evaluation is the protocol: no change request may replace
  # it mid-campaign (the RelBench arm's maintainer rewrote the scoring
  # across origins at iteration one and every candidate failed under it).
  max_change_requests: 0
