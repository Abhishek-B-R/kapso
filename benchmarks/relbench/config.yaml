# RelBench: an override file over the packaged config. The engine's
# settings are at the top level, in the shape the packaged file names;
# `kapso doctor --show-config --config benchmarks/relbench/config.yaml`
# prints what a run uses. The runner writes a runtime copy with the task's
# shared cache (`.kapso_runtime/config.yaml`) and launches the facade's
# build() on it with the bundled predictive-modelling harness; the
# `benchmark:` block at the end is the runner's own.

# Benchmark harness: nobody is at the keyboard, so a session never asks a
# person and never pauses.
inbox:
  enabled: false

search_strategy:
  params:
    # Implementation, verification and the judge run on the codex CLI
    # (gpt-5.6-sol at xhigh, OpenAI's reasoning ceiling).
    host: codex
    ideation:
      # "bank" resolves only when the campaign serves experience; with
      # nothing loaded it is skipped quietly. The judge mounts no gates.
      gates: [experiment_history, repo_memory, bank]
      candidates_per_member: 3
      # Ideation is deliberately unbounded: the strategy clamps every phase
      # to the remaining wall-clock budget, so with this sentinel-high cap
      # the campaign clock is the ONLY limit on ideation — each round stays
      # bounded, the phase inside it does not.
      timeout: 86400
      # Ensemble ideation mirroring the ioai-2025 IOAI deployment: a GPT
      # member via codex and a Claude member, their lenses designed per
      # task by the web-enabled lens planner (so no static `lens:` keys).
      # The codex member authenticates via ~/.codex/auth.json, the claude
      # members via CLAUDE_CODE_OAUTH_TOKEN.
      ensemble:
        - {cli: codex, effort: xhigh}
        - {cli: claude_code, model: claude-fable-5, effort: xhigh}
      # A web-enabled Fable session surveys how this task's problem family
      # is attacked and designs one lens per member at iteration 1; every
      # later iteration a keep-or-revise session re-judges the plan.
      lens_planner: {cli: claude_code, model: claude-fable-5, effort: max, timeout: 600}
      selector: {cli: codex, effort: xhigh}
      # Member/selector carve-up of the ideation clamp, tuned under the
      # split model (the campaign's proven timing).
      ensemble_time_split: {member_fraction: 0.7, selector_fraction: 0.3}
    implementation:
      gates: [repo_memory, bank]
      # Temporal-leakage protocol: the test window's future exists on the
      # web, so implementation sessions get no live web on either host.
      web: false
      # One experiment = implement + run the registered full evaluation
      # (candidate training, up to the task's full timeout) inside the
      # session: the cap covers a 4h full-eval cap (the medium tier's
      # `benchmark.timeouts`) plus the implement phase (~1h).
      timeout: 18000
    judge:
      timeout: 900
    gate_failure_policy: skip
    # A benchmark has no "goal achieved": the judge's stop vote is advisory
    # and the campaign runs to its budget.
    honor_agent_stop: false
    # K-way node expansion: the selector emits a ranked top-4 and each is
    # implemented and evaluated on its own parallel lane, PINNED to its
    # own GPU via CUDA_VISIBLE_DEVICES. Threads sized for the on-demand
    # a2-highgpu-4g (48 vCPU / 340 GB / 4x A100-40GB): 4x11=44 of 48,
    # leaving headroom for the orchestrator.
    node_expansion_value: 4
    expansion_lane_env:
      - {CUDA_VISIBLE_DEVICES: "0", OMP_NUM_THREADS: "11", MKL_NUM_THREADS: "11", OPENBLAS_NUM_THREADS: "11", NUMEXPR_MAX_THREADS: "11"}
      - {CUDA_VISIBLE_DEVICES: "1", OMP_NUM_THREADS: "11", MKL_NUM_THREADS: "11", OPENBLAS_NUM_THREADS: "11", NUMEXPR_MAX_THREADS: "11"}
      - {CUDA_VISIBLE_DEVICES: "2", OMP_NUM_THREADS: "11", MKL_NUM_THREADS: "11", OPENBLAS_NUM_THREADS: "11", NUMEXPR_MAX_THREADS: "11"}
      - {CUDA_VISIBLE_DEVICES: "3", OMP_NUM_THREADS: "11", MKL_NUM_THREADS: "11", OPENBLAS_NUM_THREADS: "11", NUMEXPR_MAX_THREADS: "11"}
    # Bash-tool clock policy (finding 14): without these the CLI
    # auto-backgrounds any foreground command at 120s, making a blocking
    # registered evaluation structurally impossible. Max sized above the
    # 4h full-eval cap so the agent can hold a foreground eval to
    # completion (30 min default / 5h max).
    session_env_defaults:
      BASH_DEFAULT_TIMEOUT_MS: "1800000"
      BASH_MAX_TIMEOUT_MS: "18000000"
    # Durable-archive recovery root for the registered evaluation (Issue
    # 2): the grader archives runs (incl. manifest.txt) here, outside the
    # session workspace, so a completed eval's score is recoverable even
    # after session teardown. The same root as `benchmark.work_root`.
    registered_evaluation_archive_glob: "tmp/relbench/*/runs"

# Time-budgeted campaigns: the search decides its own iteration count;
# launch with a high -i so the clock, not the counter, is binding. The
# admission floor keeps a doomed final round (needs ~1h+ with 4h evals)
# from being started; the reserve protects the final evaluation.
budget:
  minutes: 600
  reserve_minutes: 15
  min_iteration_seconds: 1800
  # Durable-clock heartbeat: generic-strategy rounds span hours, so
  # boundary-only checkpoints let a SPOT preemption rewind the budget
  # clock on resume (seen live: an A/B arm nearly doubled its budget).
  # The heartbeat patches elapsed_seconds mid-round.
  checkpoint_heartbeat_seconds: 300

evaluation_maintainer:
  enabled: true
  timeout: 1800
  # Registration calibrates via a fast-fidelity run = the candidate's
  # --debug mode; must fit the debug-tier cap.
  calibration_timeout_seconds: 1200
  max_change_requests: 3
  # Late-transition freeze: past this fraction of the time budget,
  # evaluator change requests are deferred — a ruler change near the
  # deadline orphans final selection (2026-08-16: a transition at 92%
  # budget left one eligible final from a 12h ladder).
  transition_freeze_fraction: 0.85

retry:
  max_attempts: 5
  initial_delay_seconds: 5
  max_delay_seconds: 120
  multiplier: 2
  jitter: true

# The runner's own keys; the engine never reads this block.
benchmark:
  # The archive root: <work_root>/<dataset>--<task>/ holds the sanitized
  # copy, the per-tick snapshots, the staged evaluation, the shared cache
  # and the runs. `registered_evaluation_archive_glob` above names the
  # same root.
  work_root: tmp/relbench
  # The candidate's caps in seconds by the database's size tier
  # (task_specs.SIZE_TIER): one full training run, and the --debug run
  # that gates the pipeline.
  timeouts:
    small: {full: 7200, debug: 900}
    medium: {full: 14400, debug: 1200}
    large: {full: 28800, debug: 1800}
  # What the Brief grants the candidates beyond the data: a hosted model
  # API (`openai`, with the key in the campaign's .env) or `none`.
  hosted_model_api: none
