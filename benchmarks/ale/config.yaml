# ALE-Bench: an override file over the packaged config. The engine's
# settings are at the top level; the runner's own are under `benchmark:`.
#
# Usage:
#   python -m benchmarks.ale.runner --problem <id> [--coding-agent <cli>]

# Benchmark harness: nobody is at the keyboard, so a session never asks a
# person and never pauses.
inbox:
  enabled: false

search_strategy:
  params:
    # Implementation, verification and the judge on the codex CLI;
    # ideation on Claude Code with the packaged model.
    host: codex
    ideation:
      cli: claude_code
      gates: [research, experiment_history, repo_memory]
    implementation:
      gates: [research, repo_memory]
      timeout: 7200
    judge:
      timeout: 900
    gate_failure_policy: skip
    # A benchmark has no "goal achieved": the judge's stop vote is advisory
    # and the campaign runs to its budget.
    honor_agent_stop: false
    session_env_defaults:
      BASH_DEFAULT_TIMEOUT_MS: "1800000"
      BASH_MAX_TIMEOUT_MS: "7200000"

# The runner's own settings (benchmarks/ale/runner.py reads these; the
# engine never does).
benchmark:
  # Whether the runner serves the knowledge graph.
  use_knowledge_graph: false
