# ALE-Bench: an override file over the packaged config. The engine's
# settings are at the top level; the runner's own are under `benchmark:`.
# The runner writes a runtime copy with the problem's shared cache and
# launches the facade's build() on it with the bundled
# competitive-programming harness.
#
# Usage:
#   python -m benchmarks.ale.runner --problem <id> [-i N] [--workspace DIR] [--resume]
#       [--harness REF] [--experience REFS] [--coding-agent <cli>]

# Benchmark harness: nobody is at the keyboard, so a session never asks a
# person and never pauses.
inbox:
  enabled: false

search_strategy:
  params:
    # Implementation, verification and the judge on the codex CLI;
    # ideation on Claude Code with the packaged model.
    host: codex
    ideation:
      cli: claude_code
      gates: [research, experiment_history, repo_memory, bank]
    implementation:
      gates: [research, repo_memory, bank]
      timeout: 7200
    judge:
      timeout: 900
    gate_failure_policy: skip
    # A benchmark has no "goal achieved": the judge's stop vote is advisory
    # and the campaign runs to its budget.
    honor_agent_stop: false
    session_env_defaults:
      BASH_DEFAULT_TIMEOUT_MS: "1800000"
      BASH_MAX_TIMEOUT_MS: "7200000"

# The provided grader is registered by the maintainer, whose calibration
# runs the seeded baseline once over the public cases.
evaluation_maintainer:
  enabled: true
  timeout: 1800
  calibration_timeout_seconds: 1200
  # The official evaluation is the protocol: no change request may replace
  # it mid-campaign (the RelBench arm's maintainer rewrote the scoring
  # across origins at iteration one and every candidate failed under it).
  max_change_requests: 0

# The runner's own settings (benchmarks/ale/runner.py reads these; the
# engine never does).
benchmark:
  # The archive root: <work_root>/<problem>/ holds the task root, the
  # staged evaluation, the shared cache and the final report.
  work_root: tmp/ale
  # The official scorer's runs per full evaluation: a randomised solution
  # is a noisy measurement, and the score of record is the mean.
  runs: 4
  # The judge's parallel case workers.
  num_workers: 25
  # The score a submission with a failed case takes, the worst value of
  # either direction: the contest's all-or-nothing rule.
  floor_scores:
    higher_is_better: 0
    lower_is_better: 1000000000000000000
