# MLE-Bench: an override file over the packaged config. The engine's
# settings are at the top level; the runner's own are under `benchmark:`.
# The runner writes a runtime copy with the competition's shared cache and
# launches the facade's build() on it with the bundled predictive-modelling
# harness.
#
# Usage:
#   python -m benchmarks.mle.runner --competition <id> [-i N] [--workspace DIR] [--resume]
#       [--harness REF] [--experience REFS] [--coding-agent <cli>]

# Benchmark harness: nobody is at the keyboard, so a session never asks a
# person and never pauses.
inbox:
  enabled: false

search_strategy:
  params:
    # Implementation, verification and the judge on the codex CLI;
    # ideation on Claude Code with the packaged model.
    host: codex
    ideation:
      cli: claude_code
      gates: [research, experiment_history, repo_memory, bank]
    implementation:
      gates: [repo_memory, bank]
      # The harness's standing rule, no web in implementation and
      # verification, is the engine's permission here too: the deny-web
      # hook cannot see Codex's native search, only this switch turns it
      # off, and the research gate is web as well. A competition's test
      # labels exist on the web.
      web: false
      # One experiment = implement + run the registered full evaluation
      # (the candidate's debug run, then its full run under
      # `benchmark.timeouts`) inside the session.
      timeout: 14400
    judge:
      timeout: 900
    gate_failure_policy: skip
    # A benchmark has no "goal achieved": the judge's stop vote is advisory
    # and the campaign runs to its budget.
    honor_agent_stop: false
    session_env_defaults:
      BASH_DEFAULT_TIMEOUT_MS: "1800000"
      BASH_MAX_TIMEOUT_MS: "14400000"

# The provided grader is registered by the maintainer, whose calibration
# runs the seeded baseline's --debug mode; it must fit the debug cap.
evaluation_maintainer:
  enabled: true
  timeout: 1800
  calibration_timeout_seconds: 1200
  # The official evaluation is the protocol: no change request may replace
  # it mid-campaign (the RelBench arm's maintainer rewrote the scoring
  # across origins at iteration one and every candidate failed under it).
  max_change_requests: 0

# The runner's own settings (benchmarks/mle/runner.py reads these; the
# engine never does).
benchmark:
  # The archive root: <work_root>/<competition>/ holds the prepared data,
  # the staged evaluation, the shared cache and the final report.
  work_root: tmp/mle
  # The candidate's caps in seconds: one full training run, and the
  # --debug run that gates the pipeline.
  timeouts:
    full: 28800
    debug: 1200
  # The score the seeded baseline reports, the worst value of either
  # direction: the floor every real candidate beats.
  floor_scores:
    higher_is_better: 0.0
    lower_is_better: 1000000000.0
  # Packages a candidate may not import: incompatible with the environment.
  forbidden_packages: [torchaudio, mmcv, openmem, faiss, pcdet]
  # How often the staged grader polls the candidate it runs (seconds).
  grader_poll_seconds: 1
